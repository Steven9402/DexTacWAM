model_name: ltx_train
is_i2v: true
report_to: None
tracker_name: ltx_trainer
logging_dir: logs
output_dir: outputs/trex_wipe_stage3_action_expert
pretrained_model_name_or_path: pretrained_models/ltx_video
train_data_class_path: data/dex_vtam_dataset.py
train_data_class: DexVTAMDataset
val_data_class_path: data/dex_vtam_dataset.py
val_data_class: DexVTAMDataset
tokenizer_class_path: transformers
tokenizer_class: T5Tokenizer
textenc_class_path: transformers
textenc_class: T5EncoderModel
vae_class_path: models/ltx_models/autoencoder_kl_ltx.py
vae_class: AutoencoderKLLTXVideo
diffusion_model_class_path: models/ltx_models/transformer_ltx_multiview.py
diffusion_model_class: LTXVideoTransformer3DModel
diffusion_scheduler_class_path: diffusers
diffusion_scheduler_class: FlowMatchEulerDiscreteScheduler
pipeline_class_path: models/pipeline/custom_pipeline.py
pipeline_class: CustomPipeline
phase: action_full
use_tactile_views: true
train_mode: action_full
loss:
  lambda_visual: 0.0
  lambda_tactile: 0.0
  action_dim_breakdown:
  - - 0
    - 60
    - force
  - - 60
    - 67
    - left_arm_target
  - - 67
    - 89
    - left_hand_target
  - - 89
    - 96
    - right_arm_target
  - - 96
    - 118
    - right_hand_target
  - - 118
    - 176
    - state
tactile_vae:
  model_path: outputs/stage1_lite_v0d_full/2026_05_20_06_52_55/checkpoints/best_recall_post/model.pt
  config:
    adapter_kind: finger_set_transformer
    latent_channels: 128
    num_fingers: 5
    spatial_h: 6
    spatial_w: 8
    num_heads: 8
    adapter_n_layers: 3
    adapter_ffn_dim: 1024
    adapter_dropout: 0.0
    use_finger_embed: true
    use_pos_query: true
    adapter_residual: weighted_mean
    gray_to_rgb_init: ones_repeat
    latent_mode: mean
    adapter_use_pose_injection: true
    adapter_pose_dim: 22
    adapter_use_timesformer: true
    adapter_timesformer_num_blocks: 2
    adapter_timesformer_num_heads: 8
    adapter_timesformer_ffn_dim: 512
    adapter_finger_dropout: 0.0
    disable_projector: true
projector:
  latent_dim: 128
  hidden_dim: 256
  num_views: 2
  warmstart_ckpt: null
  from_scratch: true
  freeze_in_action_phase: true
optim:
  lr_dit: 5.0e-05
  lr_projector: 5.0e-05
  train_steps: 50000
return_action: true
return_video: false
action_loss_scale: 1.0
train_steps: 50000
train_epochs: 10000
steps_to_save: 5000
steps_to_log: 20
steps_to_val: 500
mixed_precision: bf16
allow_tf32: false
nccl_timeout: 600
seed: 42
enable_slicing: true
enable_tiling: true
add_state: true
rand_init_action: true
caption_dropout_p: 0.06
batch_size: 16
dataloader_num_workers: 8
pin_memory: true
prefetch_factor: 2
persistent_workers: false
gradient_checkpointing: true
noise_to_first_frame: 0.1
optimizer: adamw
lr: 5e-5
beta1: 0.9
beta2: 0.95
beta3: 0.999
epsilon: 1e-8
weight_decay: 1e-5
optimizer_8bit: false
optimizer_torchao: false
scale_lr: false
max_grad_norm: 1.0
gradient_accumulation_steps: 1
lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0
flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29
pixel_wise_timestep: true
diffusion_model:
  model_path: FILL_ME_AFTER_STAGE2_TRAINING
  config:
    activation_fn: gelu-approximate
    attention_bias: true
    attention_head_dim: 64
    attention_out_bias: true
    caption_channels: 4096
    cross_attention_dim: 2048
    in_channels: 128
    norm_elementwise_affine: false
    norm_eps: 1.0e-06
    num_attention_heads: 32
    num_layers: 28
    out_channels: 128
    patch_size: 1
    patch_size_t: 1
    qk_norm: rms_norm_across_heads
    action_expert: true
    action_in_channels: 176
    action_out_channels: 176
    max_view: 3
    action_num_attention_heads: 16
    action_attention_head_dim: 32
    action_kv_rmsnorm: true
    action_kv_rmsnorm_affine: false
tactile_inference:
  action_only_dim_override: 118
data:
  train:
    data_roots: &id001
    - data/datasets_lerobot/trex_wipe
    domains: &id002
    - trex_wipe
    episodes: &id003
    - 0
    sample_size: &id004
    - 192
    - 256
    sample_n_frames: 900
    preprocess: resize
    valid_cam: &id005
    - head_img
    chunk: 9
    action_chunk: 54
    n_previous: 4
    previous_pick_mode: random
    random_crop: false
    ignore_seek: true
    action_type: absolute
    action_space: joint
    arm_layout: trex_bimanual
    stat_file: configs/trex_wipe/trex_wipe_joint_stats.json
    state_key: state
    action_key: actions
    extra_parquet_index: false
    read_tactile: true
    tactile_key: tactile
    repeat_dataset: 1000
    read_hand_pose: true
    pose_stats_path: data/stats/diverse_488/pose_stats.json
    pose_mode: per_frame
    cache_dir: data/cache/trex_wipe_v1
  val:
    data_roots: *id001
    domains: *id002
    episodes: *id003
    sample_size: *id004
    sample_n_frames: 900
    preprocess: resize
    valid_cam: *id005
    chunk: 9
    action_chunk: 54
    n_previous: 4
    previous_pick_mode: random
    random_crop: false
    ignore_seek: true
    action_type: absolute
    action_space: joint
    arm_layout: trex_bimanual
    stat_file: configs/trex_wipe/trex_wipe_joint_stats.json
    state_key: state
    action_key: actions
    extra_parquet_index: false
    read_tactile: true
    tactile_key: tactile
    read_hand_pose: true
    pose_stats_path: data/stats/diverse_488/pose_stats.json
    pose_mode: per_frame
    cache_dir: data/cache/trex_wipe_v1
  val_splits:
    trex_wipe_val:
      data_roots: *id001
      domains: *id002
      episodes: *id003
      sample_size: *id004
      sample_n_frames: 900
      preprocess: resize
      valid_cam: *id005
      chunk: 9
      action_chunk: 54
      n_previous: 4
      previous_pick_mode: random
      random_crop: false
      ignore_seek: true
      action_type: absolute
      action_space: joint
      arm_layout: trex_bimanual
      stat_file: configs/trex_wipe/trex_wipe_joint_stats.json
      state_key: state
      action_key: actions
      extra_parquet_index: false
      read_tactile: true
      tactile_key: tactile
      read_hand_pose: true
      pose_stats_path: data/stats/diverse_488/pose_stats.json
      pose_mode: per_frame
      cache_dir: data/cache/trex_wipe_v1
use_color_jitter: true
num_inference_step: 10
noisy_video: true
load_weights: true
use_deepspeed: true
deepspeed:
  zero_optimization:
    stage: 2
  fp16:
    enabled: false
  bf16:
    enabled: true
  gradient_clipping: 1.0
